name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: CI only checks out and tests.
permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.5
      # .env is a bundled asset but gitignored; placeholder values keep Env.isConfigured false.
      - run: cp .env.example .env
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # Catches plugin/Gradle breakages that the tests can't see (e.g. AGP 9 vs. old plugins).
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.5
      - run: cp .env.example .env
      - run: flutter pub get
      - run: flutter build apk --debug
