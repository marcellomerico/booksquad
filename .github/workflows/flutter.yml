name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: CI only checks out and tests.
permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.44.5
      # .env is a bundled asset but gitignored; empty values keep Env.isConfigured false.
      - run: printf 'SUPABASE_URL=\nSUPABASE_ANON_KEY=\n' > .env
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # Catches plugin/Gradle breakages that the tests can't see (e.g. AGP 9 vs. old plugins).
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.44.5
      - run: printf 'SUPABASE_URL=\nSUPABASE_ANON_KEY=\n' > .env
      - run: flutter pub get
      - run: flutter build apk --debug
